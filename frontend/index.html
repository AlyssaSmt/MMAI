<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Montagsmaler KI</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Mini-CSS für Galerie -->
  <style>
    .layout {
      display: flex;
      gap: 30px;
      align-items: flex-start;
    }

    .left {
      flex: 0 0 auto;
    }

    .right {
      flex: 1;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, 80px);
      gap: 10px;
    }

    .gallery img {
      width: 80px;
      height: 80px;
      background: white;
      border: 1px solid #ccc;
    }
  </style>
</head>

<body>
  <h1>🎨 Montagsmaler mit KI</h1>

  <p>
    <strong>Zeichne:</strong>
    <span id="target-word">–</span>
  </p>

  <!-- ================= Layout ================= -->
  <div class="layout">

    <!-- ===== Linke Seite: Canvas + Steuerung ===== -->
    <div class="left">
      <canvas id="canvas" width="400" height="400"></canvas>

      <div class="buttons">
        <button id="clear">🧹 Löschen/neue Kategorie</button>
        <button id="predict">🤖 KI raten lassen</button>
        <button id="pen-btn">✏️ Stift</button>
        <button id="eraser-btn">🧽 Radiergummi</button>
      </div>


      <div id="result">
        <h3>🤖 KI-Vermutung</h3>
        <button id="save-btn" style="display:none;">
          💾 Bild speichern
        </button>

        <p>
          <strong>Top-1:</strong>
          <span id="prediction">–</span>
          (<span id="confidence">–</span>)
        </p>

        <h4>Weitere Vorschläge</h4>
        <ul id="top-list"></ul>
      </div>
    </div>

    <!-- ===== Rechte Seite: Galerie ===== -->
    <div class="right">
      <h3>✅ Richtig erkannt</h3>
      <p>Diese Zeichnungen wurden von der KI korrekt erkannt:</p>
      <div id="gallery" class="gallery"></div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
